plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.group

base {
    archivesName = project.mod_id
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.minecraftforge.net" }
    maven { url = "https://maven.terraformersmc.com" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // fabric
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // neoforge
    implementation "net.neoforged.fancymodloader:loader:${project.neoforge_fml_version}"
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
    // forge
    implementation "net.minecraftforge:javafmllanguage:${project.forge_version}"
    implementation "net.minecraftforge:fmlloader:${project.forge_version}"
    implementation "net.minecraftforge:eventbus:${project.forge_eventbus_version}"
    implementation "net.minecraftforge:forge:${project.forge_version}:universal"
    // mods
    implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
    def props = [
            mod_id                              : project.mod_id,
            mod_version                         : project.mod_version,
            mod_name                            : project.mod_name,
            mod_name_short                      : project.mod_name_short,
            mod_description                     : project.mod_description,
            mod_license                         : project.mod_license,
            mod_author                          : project.mod_author,
            mod_source                          : project.mod_source,
            mod_issueTracker                    : project.mod_issueTracker,
            group                               : project.group,
            supported_minecraft_version_fabric  : project.supported_minecraft_version_fabric,
            supported_minecraft_version_forge   : project.supported_minecraft_version_forge,
            supported_minecraft_version_neoforge: project.supported_minecraft_version_neoforge,
    ]
    inputs.properties props

    filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/*mods.toml"]) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

    manifest {
        attributes(
                "MixinConfigs": "${project.mod_id}.mixins.json"
        )
    }
}